server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The application and XRF data are entirely processed in the browser.
    # The remote MediaPipe model/WASM/CDN must be reachable by the browser.
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
